<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - HSM Sign CR</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-body">
    <div class="bg-blur"></div>

    <!-- Contenedor principal con sombra -->
    <main class="auth-container">
      <!-- Panel Izquierdo: Imagen -->
      <section class="auth-image-section">
        <img
          src="../multimedia/utilitaria4.jpg"
          alt="Ilustración utilitaria estilo puntillismo"
          class="auth-img"
        />
        <div class="image-overlay-text">
          <h2>Tu firma digital, <br />ágil y segura.</h2>
          <p>
            Únete a HSM Sign CR y gestiona tus documentos con respaldo legal y
            máxima seguridad tecnológica.
          </p>
        </div>
      </section>

      <!-- Panel Derecho: Formulario de Login -->
      <section class="auth-form-section">
        <div class="brand-logo">HSM Sign CR</div>

        <div class="auth-header">
          <h1>Iniciar Sesión</h1>
          <p>Ingresa para gestionar tus firmas digitales y documentos.</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="ej. usuario@correo.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
              />
              <button
                type="button"
                id="togglePassword"
                class="btn-toggle-password"
              >
                Mostrar
              </button>
            </div>
          </div>

          <!-- Estándar de Login: Olvido de contraseña -->
          <div class="form-options">
            <a href="forgot-password.html" class="link-muted"
              >¿Olvidaste tu contraseña?</a
            >
          </div>

          <button type="submit" class="btn-primary">Ingresar al Portal</button>
        </form>

        <!-- Estándar de Login: Crear nueva cuenta -->
        <div class="auth-footer">
          <p>
            ¿Aún no tienes tu firma digital?
            <a href="register.html" class="link-highlight">Regístrate aquí</a>
          </p>
        </div>
      </section>
    </main>

    <!-- Script para funcionalidad de ver/ocultar contraseña -->
    <script>
      const togglePasswordBtn = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      togglePasswordBtn.addEventListener("click", function () {
        // Alternar entre tipo text y password
        const type =
          passwordInput.getAttribute("type") === "password"
            ? "text"
            : "password";
        passwordInput.setAttribute("type", type);

        // Cambiar el texto del botón
        this.textContent = type === "password" ? "Mostrar" : "Ocultar";
      });

      async function iniciarSesionReal(event) {
        event.preventDefault();
        const correo = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correo, password }),
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || 'No se pudo iniciar sesión');
          }

          localStorage.setItem('token', data.token);
          localStorage.setItem('contribuyente', JSON.stringify(data.contribuyente));
          window.location.href = 'user_account.html';
        } catch (err) {
          alert(err.message || 'Error al iniciar sesión');
        }
      }
      document.getElementById('loginForm').addEventListener('submit', iniciarSesionReal);
    </script>
  </body>
</html>
