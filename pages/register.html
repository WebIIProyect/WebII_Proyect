<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Cuenta - HSM Sign CR</title>
    <!-- Enlace al CSS en la raíz del proyecto -->
    <link rel="stylesheet" href="../styles.css" />
  </head>
  
  <body class="auth-body">
    <!--
      HEADER / PAGE NOTES
      - Página de registro (demo). El formulario aquí realiza un POST
        directo a `dashboard.html` para propósitos de demostración.
      - Para producción: validar en el servidor, hashear contraseñas,
        aplicar CSRF, rate-limit y nunca almacenar PINs/contraseñas en
        texto plano.
    -->
    <!-- Fondo desenfocado -->
    <div class="bg-blur"></div>
    <!-- Contenedor principal con sombra -->
    <main class="auth-container">
      <!-- Panel Izquierdo: Imagen -->
      <section class="auth-image-section">
        <img
          src="../multimedia/utilitaria4.jpg"
          alt="Ilustración utilitaria estilo puntillismo"
          class="auth-img"
        />
        <div class="image-overlay-text">
          <h2>Crea tu identidad<br />digital.</h2>
          <p>
            Da el primer paso hacia una gestión documental moderna, con validez
            jurídica y seguridad de nivel empresarial.
          </p>
        </div>
      </section>

      <!-- Panel Derecho: Formulario de Registro -->
      <section class="auth-form-section">
        <div class="brand-logo">HSM Sign CR</div>

        <div class="auth-header">
          <h1>Crear Cuenta</h1>
          <p>Completa tus datos personales para obtener tu firma digital.</p>
        </div>

        <!--
          FORMULARIO DE REGISTRO (SIMULACIÓN)
          - Actualmente `action="dashboard.html"` es solo para demo.
          - Para integrar con backend real, prevenir el submit por defecto
            y llamar a `registrarUsuarioReal(event)` o enviar los datos
            via AJAX/Fetch al endpoint seguro (ej. POST /api/register).
          - Recomendaciones: validar en server-side, enviar por TLS,
            hashear la contraseña (bcrypt/argon2), y nunca mostrar el
            valor en logs.
        -->
        <form action="dashboard.html" method="POST" class="auth-form">
          <!-- Fila de Nombre y Cédula para ahorrar espacio vertical -->
          <div class="form-row">
            <div class="form-group">
              <label for="fullname">Nombre Completo</label>
              <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Ej. Ana Pérez"
                required
              />
            </div>
            <div class="form-group">
              <label for="id_card">Cédula o DIMEX</label>
              <input
                type="text"
                id="id_card"
                name="id_card"
                placeholder="Ej. 101110111"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="reg_email">Correo Electrónico</label>
            <input
              type="email"
              id="reg_email"
              name="reg_email"
              placeholder="ej. usuario@correo.com"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="reg_password">Contraseña</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="reg_password"
                  name="reg_password"
                  placeholder="••••••••"
                  required
                />
                <button type="button" class="btn-toggle-password">
                  Mostrar
                </button>
              </div>
            </div>
            <div class="form-group">
              <label for="confirm_password">Confirmar</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="confirm_password"
                  name="confirm_password"
                  placeholder="••••••••"
                  required
                />
                <button type="button" class="btn-toggle-password">
                  Mostrar
                </button>
              </div>
            </div>
          </div>

          <button type="submit" class="btn-primary" style="margin-top: 10px">
            Registrar Usuario
          </button>
        </form>

        <div class="auth-footer">
          <p>
            ¿Ya tienes una cuenta?
            <a href="login.html" class="link-highlight">Inicia sesión aquí</a>
          </p>
        </div>
      </section>
    </main>

    <!-- Script para funcionalidad de ver/ocultar múltiples contraseñas -->
    <script>
      // Nota: este script está bien para demo/local. En producción, asegúrate
      // de no exponer contraseñas en logs o atributos data-*. Solo controla
      // la visibilidad del input.
      const toggleButtons = document.querySelectorAll(".btn-toggle-password");

      toggleButtons.forEach((button) => {
        button.addEventListener("click", function () {
          // Selecciona el input que está justo antes del botón en el HTML
          const input = this.previousElementSibling;
          const type =
            input.getAttribute("type") === "password" ? "text" : "password";
          input.setAttribute("type", type);

          // Cambiar el texto del botón
          this.textContent = type === "password" ? "Mostrar" : "Ocultar";
        });
      });

      /*
        ESQUEMA SUGERIDO: registrarUsuarioReal
        - Flujo recomendado:
          1) En el cliente validar campos básicos y prevenir submit por defecto.
          2) Enviar los datos al backend (POST /api/register) por TLS.
          3) El backend realizará validación y almacenamiento seguro
             (hash + salt), y devolverá un resultado.
        - Seguridad: nunca hashear en cliente; realizarlo en servidor.
      */
      async function registrarUsuarioReal(event) {
        event.preventDefault();
        const fullname = document.getElementById('fullname').value.trim();
        const idCard = document.getElementById('id_card').value.trim();
        const email = document.getElementById('reg_email').value.trim();
        const password = document.getElementById('reg_password').value;
        const confirm = document.getElementById('confirm_password').value;

        if (!fullname || !idCard || !email || !password) {
          return alert('Complete todos los campos requeridos.');
        }
        if (password !== confirm) {
          return alert('Las contraseñas no coinciden.');
        }

        try {
          // Deshabilitar UI / mostrar loading según UX
          const payload = { fullname, idCard, email };

          // NOTE: enviar la contraseña SOLO al backend usando HTTPS;
          // el backend debe hashear la contraseña (bcrypt/argon2) antes de almacenar.
          payload.password = password;

          const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            credentials: 'include'
          });

          if (!res.ok) {
            const text = await res.text();
            throw new Error(text || 'Error al registrar usuario');
          }

          const data = await res.json();
          if (data.success) {
            // Redirigir o mostrar mensaje según la respuesta del backend
            window.location.href = data.redirect || 'dashboard.html';
          } else {
            alert('No se pudo registrar: ' + (data.message || 'Error'));
          }
        } catch (err) {
          alert('Error al registrar: ' + (err.message || err));
        }
      }
      // Para usar la función real, ligar el submit:
      // document.querySelector('.auth-form').addEventListener('submit', registrarUsuarioReal);
    </script>
  </body>
</html>
